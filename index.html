<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짤·영상 공유 커뮤니티</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* 업로드 카드 및 드래그 앤 드롭 영역 */
        .upload-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .upload-card input[type="text"], .upload-card textarea {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .upload-card textarea {
            resize: vertical;
            height: 70px;
        }

        .upload-card input:focus, .upload-card textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* 드롭존 디자인 */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            background-color: var(--bg-color);
            cursor: pointer;
            margin-bottom: 12px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .drop-zone.dragover {
            border-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.05);
        }

        .drop-zone p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .drop-zone span {
            color: var(--accent-color);
            font-weight: 600;
        }

        #fileInput {
            display: none;
        }

        .preview-text {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 12px;
            text-align: center;
        }

        .upload-card button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .upload-card button:hover {
            background-color: var(--accent-hover);
        }

        .upload-card button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        /* 피드 카드 스타일 */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .post-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .post-author {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .post-content {
            padding: 15px;
        }

        .post-content p {
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .media-container {
            width: 100%;
            max-height: 400px;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            overflow: hidden;
        }

        .media-container img, .media-container video {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }

        /* 댓글 섹션 */
        .comments-section {
            padding: 15px;
            background-color: rgba(15, 23, 42, 0.4);
            border-top: 1px solid var(--border-color);
        }

        .comment-list {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .comment-item {
            font-size: 0.9rem;
            background-color: var(--bg-color);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .comment-item span {
            font-weight: 600;
            margin-right: 6px;
            color: var(--accent-color);
        }

        .comment-form {
            display: flex;
            gap: 8px;
        }

        .comment-form input {
            flex: 1;
            padding: 8px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .comment-form input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .comment-form button {
            padding: 8px 16px;
            background-color: var(--border-color);
            color: var(--text-color);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .comment-form button:hover {
            background-color: var(--accent-color);
        }

        .empty-feed {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>짤·영상 공유소</h1>
            <p>친구들과 함께 쓰는 실시간 연동 피드</p>
        </header>

        <!-- 업로드 영역 -->
        <div class="upload-card">
            <input type="text" id="authorInput" placeholder="닉네임">
            <textarea id="textInput" placeholder="어떤 짤이나 영상인지 적어봐"></textarea>
            
            <!-- 드래그 앤 드롭 박스 -->
            <div class="drop-zone" id="dropZone">
                <p>사진은 드래그해서 넣고, 영상은 올려도 자동 변환돼! 📥</p>
                <p><span>클릭해서 파일 선택하기</span></p>
            </div>
            <input type="file" id="fileInput" accept="image/*,video/*">
            <div class="preview-text" id="previewText">선택된 파일 없음</div>

            <button onclick="uploadPost()" id="uploadBtn">공유하기</button>
        </div>

        <!-- 피드 목록 -->
        <div class="feed-list" id="feedList">
            <div class="empty-feed">게시물을 불러오는 중...</div>
        </div>
    </div>

    <script>
        // 무료 클라우드 저장소 연동 설정 (JSONBin 무료 퍼블릭 빈 활용)
        const BIN_ID = '673a5a5fa1c521021bc6f23b'; 
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
        const PUT_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let posts = [];
        let selectedFile = null;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewText = document.getElementById('previewText');
        const uploadBtn = document.getElementById('uploadBtn');

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                previewText.textContent = `선택된 파일: ${selectedFile.name}`;
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectedFile = e.dataTransfer.files[0];
                previewText.textContent = `선택된 파일: ${selectedFile.name}`;
            }
        });

        // 클라우드에서 최신 게시물 불러오기
        async function fetchPosts() {
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    const data = await response.json();
                    posts = data.record.posts || [];
                    renderPosts();
                }
            } catch (err) {
                console.error("데이터 동기화 오류:", err);
            }
        }

        // 클라우드에 게시물 저장하기
        async function syncAndSavePosts() {
            renderPosts();
            try {
                await fetch(PUT_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ posts: posts })
                });
            } catch (err) {
                console.error("클라우드 저장 실패:", err);
            }
        }

        async function uploadPost() {
            const author = document.getElementById('authorInput').value.trim();
            const text = document.getElementById('textInput').value.trim();

            if (!author || (!text && !selectedFile)) {
                alert('닉네임과 내용(또는 파일)을 입력해줘.');
                return;
            }

            uploadBtn.disabled = true;
            let mediaUrl = '';
            let mediaType = 'image';

            if (selectedFile) {
                if (selectedFile.type.startsWith('video')) {
                    previewText.textContent = '동영상 업로드 중 (Catbox 변환 중)...';
                    try {
                        const formData = new FormData();
                        formData.append('reqtype', 'fileupload');
                        formData.append('fileToUpload', selectedFile);

                        const response = await fetch('https://catbox.moe/user/api.php', {
                            method: 'POST',
                            body: formData
                        });
                        
                        if (response.ok) {
                            mediaUrl = await response.text();
                            mediaType = 'video';
                        } else {
                            alert('동영상 업로드 실패! 다시 시도해봐.');
                            uploadBtn.disabled = false;
                            previewText.textContent = '선택된 파일 없음';
                            return;
                        }
                    } catch (err) {
                        console.error(err);
                        alert('네트워크 오류가 발생했어.');
                        uploadBtn.disabled = false;
                        previewText.textContent = '선택된 파일 없음';
                        return;
                    }
                } else {
                    // 이미지는 Base64로 즉시 변환
                    mediaType = 'image';
                    mediaUrl = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(selectedFile);
                    });
                }
            }

            const newPost = {
                id: Date.now(),
                author,
                text,
                mediaUrl,
                mediaType,
                comments: []
            };

            posts.unshift(newPost);
            await syncAndSavePosts();
            
            // 입력창 초기화
            document.getElementById('textInput').value = '';
            fileInput.value = '';
            selectedFile = null;
            previewText.textContent = '선택된 파일 없음';
            uploadBtn.disabled = false;
        }

        async function addComment(postId) {
            const commentInput = document.getElementById(`comment-input-${postId}`);
            const commentText = commentInput.value.trim();

            if (!commentText) return;

            const post = posts.find(p => p.id === postId);
            if (post) {
                if (!post.comments) post.comments = [];
                post.comments.push({
                    author: "친구",
                    text: commentText
                });
                commentInput.value = '';
                await syncAndSavePosts();
            }
        }

        function renderPosts() {
            const feedList = document.getElementById('feedList');
            
            if (posts.length === 0) {
                feedList.innerHTML = '<div class="empty-feed">아직 공유된 게시물이 없어. 첫 번째 게시물을 올려봐!</div>';
                return;
            }

            feedList.innerHTML = '';

            posts.forEach(post => {
                const postCard = document.createElement('div');
                postCard.className = 'post-card';

                let mediaHtml = '';
                if (post.mediaUrl) {
                    if (post.mediaType === 'video') {
                        mediaHtml = `
                            <div class="media-container">
                                <video src="${post.mediaUrl}" controls></video>
                            </div>
                        `;
                    } else {
                        mediaHtml = `
                            <div class="media-container">
                                <img src="${post.mediaUrl}" alt="이미지">
                            </div>
                        `;
                    }
                }

                let commentsHtml = (post.comments || []).map(c => `
                    <div class="comment-item">
                        <span>${c.author}</span>${c.text}
                    </div>
                `).join('');

                postCard.innerHTML = `
                    <div class="post-header">
                        <span class="post-author">${post.author}</span>
                    </div>
                    <div class="post-content">
                        <p>${post.text}</p>
                        ${mediaHtml}
                    </div>
                    <div class="comments-section">
                        <div class="comment-list" id="comment-list-${post.id}">
                            ${commentsHtml}
                        </div>
                        <div class="comment-form">
                            <input type="text" id="comment-input-${post.id}" placeholder="댓글을 남겨봐..." onkeypress="if(event.key === 'Enter') addComment(${post.id})">
                            <button onclick="addComment(${post.id})">등록</button>
                        </div>
                    </div>
                `;

                feedList.appendChild(postCard);
            });
        }

        // 실행 시 데이터 불러오기 및 3초마다 자동 새로고침(동기화)
        fetchPosts();
        setInterval(fetchPosts, 3000);
    </script>
</body>
</html>

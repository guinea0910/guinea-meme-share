<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기니 짤방 웹버전</title>
    <style>
        :root {
            --cafe-green: #03c75a;
            --cafe-green-hover: #02b350;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        h2, h3 { color: var(--cafe-green); }
        .box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: var(--cafe-green);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: var(--cafe-green-hover); }
        .danger-btn { background-color: var(--danger-color); }
        .danger-btn:hover { background-color: #dc2626; }
        
        .tab-btn {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            margin-right: 5px;
            margin-bottom: 15px;
        }
        .tab-btn.active {
            background-color: var(--cafe-green);
            color: white;
            border-color: var(--cafe-green);
        }
        
        /* 드래그 앤 드롭 영역 스타일 */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .drop-zone.dragover {
            background-color: rgba(3, 199, 90, 0.1);
            border-color: var(--cafe-green);
            color: var(--cafe-green);
        }
        
        .preview-container {
            position: relative;
            margin-bottom: 10px;
            display: inline-block;
        }
        .preview-img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .remove-img-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
        }

        .post-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .post-author { font-weight: bold; color: var(--cafe-green); }
        .post-content { color: var(--text-main); white-space: pre-wrap; margin-bottom: 10px; }
        .post-img { max-width: 100%; border-radius: 6px; margin-top: 10px; }
        
        .comment-section {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 10px;
            font-size: 14px;
        }
        .comment-item {
            background-color: rgba(15, 23, 42, 0.4);
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .comment-author { font-weight: bold; color: var(--text-sub); font-size: 13px; }
        .hidden { display: none !important; }
        .error-box { background-color: #451a03; border: 1px solid #b45309; color: #fde68a; padding: 10px; border-radius: 6px; margin-bottom: 10px; word-break: break-all; }
    </style>
</head>
<body>

    <h2>🍀 기니 짤방 웹버전</h2>

    <!-- 인증 영역 (로그인/회원가입) -->
    <div id="authBox" class="box">
        <div>
            <button id="loginTabBtn" class="tab-btn active" onclick="switchTab('login')">로그인</button>
            <button id="signupTabBtn" class="tab-btn" onclick="switchTab('signup')">회원가입</button>
        </div>

        <div id="loginForm">
            <input type="text" id="loginId" placeholder="아이디 (닉네임)">
            <input type="password" id="loginPw" placeholder="비밀번호">
            <button onclick="handleLogin()">로그인</button>
        </div>

        <div id="signupForm" class="hidden">
            <input type="text" id="signupId" placeholder="사용할 아이디 (닉네임)">
            <input type="password" id="signupPw" placeholder="비밀번호">
            <button onclick="handleSignup()">가입하기</button>
        </div>
    </div>

    <!-- 메인 게시판 영역 -->
    <div id="mainBox" class="hidden">
        <div class="box" style="display: flex; justify-content: space-between; align-items: center;">
            <div>환영합니다, <span id="currentUserSpan" style="color: var(--cafe-green); font-weight: bold;"></span>님!</div>
            <button class="danger-btn" onclick="handleLogout()" style="padding: 5px 10px; font-size: 12px;">로그아웃</button>
        </div>

        <div class="box">
            <h3>글 작성하기</h3>
            <textarea id="postContent" rows="3" placeholder="내용을 입력해 주세요..."></textarea>
            
            <!-- 드래그 앤 드롭 사진 업로드 영역 -->
            <div id="dropZone" class="drop-zone">
                사진 업로드
            </div>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            
            <!-- 미리보기 영역 -->
            <div id="previewArea" class="hidden" style="margin-bottom: 10px;">
                <div class="preview-container">
                    <img id="previewImg" class="preview-img" src="" alt="미리보기">
                    <button class="remove-img-btn" onclick="removeImage()">✕</button>
                </div>
            </div>

            <button onclick="handleCreatePost()">등록</button>
        </div>
    </div>

    <h3>전체 목록</h3>
    <div id="postsContainer">게시글 불러오는 중...</div>

    <!-- Firebase 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, deleteDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfcOH-oargpwPPSxJwIycKnx7o9OGWxwo",
            authDomain: "guinea-meme-share.firebaseapp.com",
            projectId: "guinea-meme-share",
            storageBucket: "guinea-meme-share.firebasestorage.app",
            messagingSenderId: "282265476408",
            appId: "1:282265476408:web:f07087dd3a2cf80093b5cd",
            measurementId: "G-9W4YK0GMK4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = localStorage.getItem('cafe_user') || null;
        let compressedImageData = null; // 압축된 이미지 데이터 보관용

        window.switchTab = function(type) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTab = document.getElementById('loginTabBtn');
            const signupTab = document.getElementById('signupTabBtn');

            if(type === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                loginTab.classList.remove('active');
                signupTab.classList.add('active');
            }
        };

        window.handleSignup = async function() {
            const id = document.getElementById('signupId').value.trim();
            const pw = document.getElementById('signupPw').value.trim();
            if(!id || !pw) { alert('아이디와 비밀번호를 모두 입력해 주세요!'); return; }

            try {
                const userRef = doc(db, "users", id);
                const userSnap = await getDoc(userRef);
                if(userSnap.exists()) { alert('이미 존재하는 아이디입니다!'); return; }

                await setDoc(userRef, { password: pw });
                alert('회원가입 완료! 로그인해 주세요.');
                switchTab('login');
                document.getElementById('loginId').value = id;
            } catch (error) {
                alert('회원가입 실패: ' + error.message);
            }
        };

        window.handleLogin = async function() {
            const id = document.getElementById('loginId').value.trim();
            const pw = document.getElementById('loginPw').value.trim();
            if(!id || !pw) { alert('아이디와 비밀번호를 입력해 주세요!'); return; }

            try {
                const userRef = doc(db, "users", id);
                const userSnap = await getDoc(userRef);
                if(!userSnap.exists() || userSnap.data().password !== pw) {
                    alert('아이디 또는 비밀번호가 일치하지 않습니다.');
                    return;
                }
                currentUser = id;
                localStorage.setItem('cafe_user', id);
                checkAuthState();
            } catch (error) {
                alert('로그인 실패: ' + error.message);
            }
        };

        window.handleLogout = function() {
            currentUser = null;
            localStorage.removeItem('cafe_user');
            checkAuthState();
        };

        function checkAuthState() {
            const authBox = document.getElementById('authBox');
            const mainBox = document.getElementById('mainBox');
            const currentUserSpan = document.getElementById('currentUserSpan');

            if(currentUser) {
                authBox.classList.add('hidden');
                mainBox.classList.remove('hidden');
                currentUserSpan.textContent = currentUser;
            } else {
                authBox.classList.remove('hidden');
                mainBox.classList.add('hidden');
            }
            loadPosts();
        }

        // --- 드래그 앤 드롭 및 이미지 압축 로직 ---
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                processImageFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                processImageFile(e.target.files[0]);
            }
        });

        function processImageFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('이미지 파일만 업로드할 수 있습니다!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // 캔버스를 이용해 가로세로 크기를 1/2로 줄이기
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.floor(img.width / 2);
                    canvas.height = Math.floor(img.height / 2);

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // 압축된 Base64 데이터 생성 (JPEG 80% 화질)
                    compressedImageData = canvas.toDataURL('image/jpeg', 0.8);

                    // 미리보기 표시
                    document.getElementById('previewImg').src = compressedImageData;
                    document.getElementById('previewArea').classList.remove('hidden');
                    dropZone.classList.add('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.removeImage = function() {
            compressedImageData = null;
            fileInput.value = '';
            document.getElementById('previewArea').classList.add('hidden');
            dropZone.classList.remove('hidden');
        };

        // 게시글 작성
        window.handleCreatePost = async function() {
            const content = document.getElementById('postContent').value.trim();
            if(!content && !compressedImageData) {
                alert('내용이나 사진을 입력해 주세요');
                return;
            }

            try {
                await addDoc(collection(db, "posts"), {
                    author: currentUser,
                    content: content,
                    image: compressedImageData || null,
                    createdAt: Date.now(),
                    comments: []
                });
                
                // 초기화
                document.getElementById('postContent').value = '';
                removeImage();
                loadPosts();
            } catch (error) {
                console.error(error);
                alert('게시글 등록 실패: ' + error.message);
            }
        };

        // 게시글 삭제
        window.handleDeletePost = async function(postId, author) {
            if(currentUser !== author) { alert('자신이 쓴 글만 삭제할 수 있습니다!'); return; }
            if(!confirm('정말 이 게시글을 삭제하시겠습니까?')) return;

            try {
                await deleteDoc(doc(db, "posts", postId));
                loadPosts();
            } catch (error) {
                alert('삭제 실패: ' + error.message);
            }
        };

        // 댓글 작성
        window.handleAddComment = async function(postId) {
            const input = document.getElementById(`commentInput_${postId}`);
            const commentText = input.value.trim();
            if(!commentText) return;

            try {
                const postRef = doc(db, "posts", postId);
                await updateDoc(postRef, {
                    comments: arrayUnion({
                        author: currentUser,
                        content: commentText,
                        createdAt: Date.now()
                    })
                });
                input.value = '';
                loadPosts();
            } catch (error) {
                alert('댓글 등록 실패: ' + error.message);
            }
        };

        // 게시글 목록 불러오기
        async function loadPosts() {
            const postsContainer = document.getElementById('postsContainer');
            postsContainer.innerHTML = '불러오는 중...';
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                if(querySnapshot.empty) {
                    postsContainer.innerHTML = '등록된 게시물이 없습니다.';
                    return;
                }

                postsContainer.innerHTML = '';
                const posts = [];
                querySnapshot.forEach((docSnap) => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                posts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                posts.forEach((post) => {
                    const card = document.createElement('div');
                    card.className = 'post-card';

                    let deleteBtnHtml = '';
                    if(currentUser && currentUser === post.author) {
                        deleteBtnHtml = `<button class="danger-btn" onclick="handleDeletePost('${post.id}', '${post.author}')" style="padding: 3px 8px; font-size: 11px;">삭제</button>`;
                    }

                    let imgHtml = '';
                    if(post.image) {
                        imgHtml = `<img src="${post.image}" class="post-img" alt="업로드 이미지">`;
                    }

                    let commentsHtml = '';
                    if(post.comments && Array.isArray(post.comments)) {
                        post.comments.forEach(c => {
                            commentsHtml += `
                                <div class="comment-item">
                                    <div class="comment-author">${escapeHtml(c.author)}</div>
                                    <div>${escapeHtml(c.content)}</div>
                                </div>
                            `;
                        });
                    }

                    card.innerHTML = `
                        <div class="post-header">
                            <span class="post-author">${escapeHtml(post.author)}</span>
                            ${deleteBtnHtml}
                        </div>
                        <div class="post-content">${escapeHtml(post.content)}</div>
                        ${imgHtml}
                        <div class="comment-section">
                            <div style="font-weight: bold; margin-bottom: 5px;">댓글</div>
                            ${commentsHtml}
                            <div style="display: flex; gap: 5px; margin-top: 8px;">
                                <input type="text" id="commentInput_${post.id}" placeholder="댓글을 입력하세요..." style="margin-bottom:0;">
                                <button onclick="handleAddComment('${post.id}')" style="white-space: nowrap;">등록</button>
                            </div>
                        </div>
                    `;
                    postsContainer.appendChild(card);
                });
            } catch (error) {
                postsContainer.innerHTML = `<div class="error-box"><b>[불러오기 에러 발생]</b><br>${error.message}</div>`;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        checkAuthState();
    </script>
</body>
</html>

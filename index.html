<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기니 짤방 웹버전</title>
    <style>
        :root {
            --cafe-green: #03c75a;
            --cafe-green-hover: #02b350;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --input-bg: #0f172a;
        }

        /* 라이트 모드 테마 변수 */
        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            transition: background-color 0.2s, color 0.2s;
        }
        h2, h3 { color: var(--cafe-green); }
        .box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: var(--cafe-green);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: var(--cafe-green-hover); }
        .danger-btn { background-color: var(--danger-color); }
        .danger-btn:hover { background-color: #dc2626; }
        
        .tab-btn {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            margin-right: 5px;
            margin-bottom: 15px;
        }
        .tab-btn.active {
            background-color: var(--cafe-green);
            color: white;
            border-color: var(--cafe-green);
        }
        
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .drop-zone.dragover {
            background-color: rgba(3, 199, 90, 0.1);
            border-color: var(--cafe-green);
            color: var(--cafe-green);
        }
        
        .preview-container {
            position: relative;
            margin-bottom: 10px;
            display: inline-block;
        }
        .preview-img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .remove-img-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
        }

        .post-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .post-author { font-weight: bold; color: var(--cafe-green); }
        .post-time { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; }
        .post-content { color: var(--text-main); white-space: pre-wrap; margin-bottom: 10px; }
        .post-img { max-width: 100%; border-radius: 6px; margin-top: 10px; }
        
        .post-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .like-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .like-btn.liked {
            background-color: rgba(3, 199, 90, 0.15);
            border-color: var(--cafe-green);
            color: var(--cafe-green);
        }

        .comment-section {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 10px;
            font-size: 14px;
        }
        .comment-item {
            background-color: var(--input-bg);
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            border: 1px solid var(--border-color);
        }
        .comment-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 2px; }
        .comment-author { font-weight: bold; color: var(--text-sub); }
        .comment-time { font-size: 11px; color: var(--text-sub); }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hidden { display: none !important; }
        .error-box { background-color: #451a03; border: 1px solid #b45309; color: #fde68a; padding: 10px; border-radius: 6px; margin-bottom: 10px; word-break: break-all; }
    </style>
</head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="margin: 0;">🍀 기니 짤방 웹버전</h2>
        <button id="settingsToggleBtn" class="hidden" onclick="toggleSettings()" style="background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 5px 10px; font-size: 13px;">⚙️ 설정</button>
    </div>

    <!-- 설정 영역 -->
    <div id="settingsBox" class="box hidden">
        <h3>계정 및 테마 설정</h3>
        <div style="margin-bottom: 10px;">
            <label style="font-size: 13px; color: var(--text-sub);">아이디 (변경 불가)</label>
            <input type="text" id="settingsId" disabled style="opacity: 0.7; cursor: not-allowed;">
        </div>
        <div style="margin-bottom: 10px;">
            <label style="font-size: 13px; color: var(--text-sub);">새 비밀번호</label>
            <input type="password" id="settingsPw" placeholder="변경할 비밀번호 입력 (공백이면 유지)">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="font-size: 13px; color: var(--text-sub);">화면 테마</label>
            <select id="settingsTheme" onchange="previewTheme()">
                <option value="dark">다크 모드</option>
                <option value="light">라이트 모드</option>
            </select>
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="handleSaveSettings()" style="flex: 1;">설정 저장</button>
            <button onclick="toggleSettings()" class="danger-btn" style="flex: 1;">닫기</button>
        </div>
    </div>

    <!-- 인증 영역 (로그인/회원가입) -->
    <div id="authBox" class="box">
        <div>
            <button id="loginTabBtn" class="tab-btn active" onclick="switchTab('login')">로그인</button>
            <button id="signupTabBtn" class="tab-btn" onclick="switchTab('signup')">회원가입</button>
        </div>

        <div id="loginForm">
            <input type="text" id="loginId" placeholder="아이디 (닉네임)">
            <input type="password" id="loginPw" placeholder="비밀번호">
            <button onclick="handleLogin()">로그인</button>
        </div>

        <div id="signupForm" class="hidden">
            <input type="text" id="signupId" placeholder="사용할 아이디 (닉네임)">
            <input type="password" id="signupPw" placeholder="비밀번호">
            <button onclick="handleSignup()">가입하기</button>
        </div>
    </div>

    <!-- 메인 게시판 영역 -->
    <div id="mainBox" class="hidden">
        <div class="box top-bar">
            <div>환영합니다, <span id="currentUserSpan" style="color: var(--cafe-green); font-weight: bold;"></span>님!</div>
            <button class="danger-btn" onclick="handleLogout()" style="padding: 5px 10px; font-size: 12px;">로그아웃</button>
        </div>

        <div class="box">
            <h3>글 작성하기</h3>
            <textarea id="postContent" rows="3" placeholder="내용을 입력해 주세요..."></textarea>
            
            <div id="dropZone" class="drop-zone">
                사진 업로드
            </div>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            
            <div id="previewArea" class="hidden" style="margin-bottom: 10px;">
                <div class="preview-container">
                    <img id="previewImg" class="preview-img" src="" alt="미리보기">
                    <button class="remove-img-btn" onclick="removeImage()">✕</button>
                </div>
            </div>

            <button onclick="handleCreatePost()">등록</button>
        </div>
    </div>

    <h3>전체 목록</h3>
    <div id="postsContainer">게시글 불러오는 중...</div>

    <!-- Firebase SDK (안정적인 v10 버전 사용) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, deleteDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfcOH-oargpwPPSxJwIycKnx7o9OGWxwo",
            authDomain: "guinea-meme-share.firebaseapp.com",
            projectId: "guinea-meme-share",
            storageBucket: "guinea-meme-share.firebasestorage.app",
            messagingSenderId: "282265476408",
            appId: "1:282265476408:web:f07087dd3a2cf80093b5cd",
            measurementId: "G-9W4YK0GMK4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = localStorage.getItem('cafe_user') || null;
        let compressedImageData = null;

        window.switchTab = function(type) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTab = document.getElementById('loginTabBtn');
            const signupTab = document.getElementById('signupTabBtn');

            if(type === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                loginTab.classList.remove('active');
                signupTab.classList.add('active');
            }
        };

        window.handleSignup = async function() {
            const id = document.getElementById('signupId').value.trim();
            const pw = document.getElementById('signupPw').value.trim();
            if(!id || !pw) { alert('아이디와 비밀번호를 모두 입력해 주세요!'); return; }

            try {
                const userRef = doc(db, "users", id);
                const userSnap = await getDoc(userRef);
                if(userSnap.exists()) { alert('이미 존재하는 아이디입니다!'); return; }

                await setDoc(userRef, { password: pw, theme: 'dark' });
                alert('회원가입 완료! 로그인해 주세요.');
                switchTab('login');
                document.getElementById('loginId').value = id;
            } catch (error) {
                console.error(error);
                alert('회원가입 실패: ' + error.message);
            }
        };

        window.handleLogin = async function() {
            const id = document.getElementById('loginId').value.trim();
            const pw = document.getElementById('loginPw').value.trim();
            if(!id || !pw) { alert('아이디와 비밀번호를 입력해 주세요!'); return; }

            try {
                const userRef = doc(db, "users", id);
                const userSnap = await getDoc(userRef);
                if(!userSnap.exists() || userSnap.data().password !== pw) {
                    alert('아이디 또는 비밀번호가 일치하지 않습니다.');
                    return;
                }
                currentUser = id;
                localStorage.setItem('cafe_user', id);
                
                const userData = userSnap.data();
                applyTheme(userData.theme || 'dark');

                checkAuthState();
            } catch (error) {
                console.error(error);
                alert('로그인 실패: ' + error.message);
            }
        };

        window.handleLogout = function() {
            currentUser = null;
            localStorage.removeItem('cafe_user');
            applyTheme('dark');
            document.getElementById('settingsBox').classList.add('hidden');
            checkAuthState();
        };

        async function checkAuthState() {
            const authBox = document.getElementById('authBox');
            const mainBox = document.getElementById('mainBox');
            const settingsToggleBtn = document.getElementById('settingsToggleBtn');
            const currentUserSpan = document.getElementById('currentUserSpan');

            if(currentUser) {
                authBox.classList.add('hidden');
                mainBox.classList.remove('hidden');
                settingsToggleBtn.classList.remove('hidden');
                currentUserSpan.textContent = currentUser;

                try {
                    const userRef = doc(db, "users", currentUser);
                    const userSnap = await getDoc(userRef);
                    if(userSnap.exists()) {
                        const data = userSnap.data();
                        applyTheme(data.theme || 'dark');
                    }
                } catch(e) {
                    console.error("테마 불러오기 에러:", e);
                }
            } else {
                authBox.classList.remove('hidden');
                mainBox.classList.add('hidden');
                settingsToggleBtn.classList.add('hidden');
                document.getElementById('settingsBox').classList.add('hidden');
            }
            loadPosts();
        }

        window.toggleSettings = async function() {
            const settingsBox = document.getElementById('settingsBox');
            if(settingsBox.classList.contains('hidden')) {
                document.getElementById('settingsId').value = currentUser;
                document.getElementById('settingsPw').value = '';
                try {
                    const userRef = doc(db, "users", currentUser);
                    const userSnap = await getDoc(userRef);
                    if(userSnap.exists()) {
                        document.getElementById('settingsTheme').value = userSnap.data().theme || 'dark';
                    }
                } catch(e) {}
                settingsBox.classList.remove('hidden');
            } else {
                settingsBox.classList.add('hidden');
                checkAuthState();
            }
        };

        window.previewTheme = function() {
            const theme = document.getElementById('settingsTheme').value;
            applyTheme(theme);
        };

        function applyTheme(theme) {
            if(theme === 'light') {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
        }

        window.handleSaveSettings = async function() {
            const newPw = document.getElementById('settingsPw').value.trim();
            const newTheme = document.getElementById('settingsTheme').value;

            try {
                const userRef = doc(db, "users", currentUser);
                const updateData = { theme: newTheme };
                if(newPw) {
                    updateData.password = newPw;
                }
                await updateDoc(userRef, updateData);
                alert('설정이 성공적으로 저장되었습니다!');
                toggleSettings();
            } catch (error) {
                console.error(error);
                alert('설정 저장 실패: ' + error.message);
            }
        };

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                processImageFile(e.dataTransfer.files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                processImageFile(e.target.files[0]);
            }
        });

        function processImageFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('이미지 파일만 업로드할 수 있습니다!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.floor(img.width / 2);
                    canvas.height = Math.floor(img.height / 2);

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    compressedImageData = canvas.toDataURL('image/jpeg', 0.8);

                    document.getElementById('previewImg').src = compressedImageData;
                    document.getElementById('previewArea').classList.remove('hidden');
                    dropZone.classList.add('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.removeImage = function() {
            compressedImageData = null;
            fileInput.value = '';
            document.getElementById('previewArea').classList.add('hidden');
            dropZone.classList.remove('hidden');
        };

        window.handleCreatePost = async function() {
            const content = document.getElementById('postContent').value.trim();
            if(!content && !compressedImageData) {
                alert('내용이나 사진을 입력해 주세요');
                return;
            }

            try {
                await addDoc(collection(db, "posts"), {
                    author: currentUser,
                    content: content,
                    image: compressedImageData || null,
                    createdAt: Date.now(),
                    likes: [],
                    comments: []
                });
                
                document.getElementById('postContent').value = '';
                removeImage();
                loadPosts();
            } catch (error) {
                console.error(error);
                alert('게시글 등록 실패: ' + error.message);
            }
        };

        window.handleDeletePost = async function(postId, author) {
            if(currentUser !== author) { alert('자신이 쓴 글만 삭제할 수 있습니다!'); return; }
            if(!confirm('정말 이 게시글을 삭제하시겠습니까?')) return;

            try {
                await deleteDoc(doc(db, "posts", postId));
                loadPosts();
            } catch (error) {
                console.error(error);
                alert('삭제 실패: ' + error.message);
            }
        };

        window.handleToggleLike = async function(postId) {
            if(!currentUser) return;
            try {
                const postRef = doc(db, "posts", postId);
                const postSnap = await getDoc(postRef);
                if(!postSnap.exists()) return;

                const data = postSnap.data();
                let likes = data.likes || [];

                if(likes.includes(currentUser)) {
                    likes = likes.filter(user => user !== currentUser);
                } else {
                    likes.push(currentUser);
                }

                await updateDoc(postRef, { likes: likes });
                loadPosts();
            } catch (error) {
                console.error(error);
                alert('좋아요 처리 실패: ' + error.message);
            }
        };

        window.handleAddComment = async function(postId) {
            const input = document.getElementById(`commentInput_${postId}`);
            const commentText = input.value.trim();
            if(!commentText) return;

            try {
                const postRef = doc(db, "posts", postId);
                await updateDoc(postRef, {
                    comments: arrayUnion({
                        author: currentUser,
                        content: commentText,
                        createdAt: Date.now()
                    })
                });
                input.value = '';
                loadPosts();
            } catch (error) {
                console.error(error);
                alert('댓글 등록 실패: ' + error.message);
            }
        };

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            const ss = String(date.getSeconds()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
        }

        async function loadPosts() {
            const postsContainer = document.getElementById('postsContainer');
            postsContainer.innerHTML = '불러오는 중...';
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                if(querySnapshot.empty) {
                    postsContainer.innerHTML = '등록된 게시물이 없습니다.';
                    return;
                }

                postsContainer.innerHTML = '';
                const posts = [];
                querySnapshot.forEach((docSnap) => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                posts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                posts.forEach((post) => {
                    const card = document.createElement('div');
                    card.className = 'post-card';

                    let deleteBtnHtml = '';
                    if(currentUser && currentUser === post.author) {
                        deleteBtnHtml = `<button class="danger-btn" onclick="handleDeletePost('${post.id}', '${post.author}')" style="padding: 3px 8px; font-size: 11px;">삭제</button>`;
                    }

                    let imgHtml = '';
                    if(post.image) {
                        imgHtml = `<img src="${post.image}" class="post-img" alt="업로드 이미지">`;
                    }

                    const likes = post.likes || [];
                    const likeCount = likes.length;
                    const isLiked = currentUser && likes.includes(currentUser);

                    const comments = post.comments || [];
                    const commentCount = comments.length;

                    let commentsHtml = '';
                    if(Array.isArray(comments)) {
                        comments.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                        comments.forEach(c => {
                            commentsHtml += `
                                <div class="comment-item">
                                    <div class="comment-header">
                                        <span class="comment-author">${escapeHtml(c.author)}</span>
                                        <span class="comment-time">${formatDate(c.createdAt)}</span>
                                    </div>
                                    <div>${escapeHtml(c.content)}</div>
                                </div>
                            `;
                        });
                    }

                    card.innerHTML = `
                        <div class="post-header">
                            <span class="post-author">${escapeHtml(post.author)}</span>
                            ${deleteBtnHtml}
                        </div>
                        <div class="post-time">${formatDate(post.createdAt)}</div>
                        <div class="post-content">${escapeHtml(post.content)}</div>
                        ${imgHtml}
                        
                        <div class="post-stats" style="margin-top: 10px;">
                            <span>❤️ 좋아요 ${likeCount}개</span>
                            <span>💬 댓글 ${commentCount}개</span>
                        </div>

                        <div class="action-row">
                            <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="handleToggleLike('${post.id}')">
                                ${isLiked ? '❤️ 좋아요 취소' : '🤍 좋아요'}
                            </button>
                        </div>

                        <div class="comment-section">
                            <div style="font-weight: bold; margin-bottom: 5px;">댓글</div>
                            ${commentsHtml}
                            <div style="display: flex; gap: 5px; margin-top: 8px;">
                                <input type="text" id="commentInput_${post.id}" placeholder="댓글을 입력하세요..." style="margin-bottom:0;">
                                <button onclick="handleAddComment('${post.id}')" style="white-space: nowrap;">등록</button>
                            </div>
                        </div>
                    `;
                    postsContainer.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                postsContainer.innerHTML = `<div class="error-box"><b>[불러오기 에러 발생]</b><br>${error.message}</div>`;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        checkAuthState();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오톡 시뮬레이터</title>
  <style>
    :root {
      --bg-color: #abc1d1;
      --chat-bg: #ffffff;
      --my-bg: #fee500;
      --text-color: #000000;
      --header-bg: #a0b4c4;
      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #1f1f1f;
      --chat-bg: #2a2a2a;
      --my-bg: #fee500;
      --text-color: #ffffff;
      --header-bg: #141414;
      --input-bg: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app-container {
      width: 380px;
      height: 680px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    /* 상단 헤더 */
    .header {
      background-color: var(--header-bg);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-color);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-img {
      width: 40px;
      height: 40px;
      border-radius: 15px;
      background-color: #ccc;
      object-fit: cover;
    }

    .user-name {
      font-weight: bold;
      font-size: 16px;
    }

    .controls button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin-left: 8px;
    }

    /* 채팅 영역 */
    .chat-area {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-row {
      display: flex;
      gap: 8px;
      max-width: 80%;
    }

    .message-row.other {
      align-self: flex-start;
    }

    .message-row.mine {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .other .bubble {
      background-color: var(--chat-bg);
      color: var(--text-color);
      border-top-left-radius: 2px;
    }

    .mine .bubble {
      background-color: var(--my-bg);
      color: #000;
      border-top-right-radius: 2px;
    }

    .bubble img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 5px;
    }

    .time-read {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      font-size: 10px;
      color: #666;
      margin: 0 4px;
    }

    .unread {
      color: #fee500;
      font-weight: bold;
      text-align: right;
    }

    /* 하단 입력창 */
    .input-area {
      background-color: var(--input-bg);
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-area input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
      background-color: var(--input-bg);
      color: var(--text-color);
    }

    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-btn {
      background-color: #fee500;
      color: #000;
    }

    .file-btn {
      background-color: #eee;
    }

    /* 모달 메뉴 (메시지 길게 누르기 대체: 우클릭) */
    .context-menu {
      display: none;
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      border-radius: 8px;
      z-index: 100;
    }

    .context-menu button {
      display: block;
      width: 100%;
      padding: 8px 15px;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
    }

    .context-menu button:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

<div class="app-container" id="app">
  <!-- 상단 헤더 -->
  <div class="header">
    <div class="header-info">
      <img src="https://via.placeholder.com/40" class="profile-img" alt="프로필">
      <div>
        <div class="user-name">어피치</div>
        <span style="font-size: 11px; color: #555;">온라인</span>
      </div>
    </div>
    <div class="controls">
      <button onclick="toggleTheme()" title="다크모드">🌙</button>
      <button onclick="simulateAutoReply()" title="자동 답장 받기">🤖</button>
    </div>
  </div>

  <!-- 메인 채팅 창 -->
  <div class="chat-area" id="chatArea">
    <div class="message-row other">
      <img src="https://via.placeholder.com/40" class="profile-img" alt="프로필">
      <div>
        <div style="font-size: 11px; margin-bottom: 2px;">어피치</div>
        <div class="bubble" oncontextmenu="showMenu(event, this)">안녕하세요! 카카오톡 UI 시뮬레이터입니다.</div>
      </div>
      <div class="time-read">
        <span>오전 10:00</span>
      </div>
    </div>
  </div>

  <!-- 메시지 입력 영역 -->
  <div class="input-area">
    <button class="btn file-btn" onclick="document.getElementById('fileInput').click()">📁</button>
    <input type="file" id="fileInput" hidden accept="image/*" onchange="sendImage(this)">
    <input type="text" id="messageInput" placeholder="메시지 입력..." onkeypress="handleKeyPress(event)">
    <button class="btn send-btn" onclick="sendMessage()">전송</button>
  </div>

  <!-- 컨텍스트 메뉴 (메시지 우클릭 시 삭제/답장) -->
  <div class="context-menu" id="contextMenu">
    <button onclick="replyMessage()">답장하기</button>
    <button onclick="deleteMessage()">삭제하기</button>
  </div>
</div>

<script>
  let selectedBubble = null;

  // 시간 포맷 생성
  function getCurrentTime() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const ampm = hours >= 12 ? '오후' : '오전';
    hours = hours % 12 || 12;
    return `${ampm} ${hours}:${minutes}`;
  }

  // 메시지 전송
  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;

    const chatArea = document.getElementById('chatArea');
    const row = document.createElement('div');
    row.className = 'message-row mine';
    row.innerHTML = `
      <div class="time-read">
        <span class="unread">1</span>
        <span>${getCurrentTime()}</span>
      </div>
      <div class="bubble" oncontextmenu="showMenu(event, this)">${escapeHtml(text)}</div>
    `;

    chatArea.appendChild(row);
    input.value = '';
    chatArea.scrollTop = chatArea.scrollHeight;

    // 1초 후 상대방이 읽음 처리 시뮬레이션
    setTimeout(() => {
      const unread = row.querySelector('.unread');
      if (unread) unread.remove();
    }, 1000);
  }

  // 이미지 전송
  function sendImage(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const chatArea = document.getElementById('chatArea');
        const row = document.createElement('div');
        row.className = 'message-row mine';
        row.innerHTML = `
          <div class="time-read">
            <span>${getCurrentTime()}</span>
          </div>
          <div class="bubble" oncontextmenu="showMenu(event, this)">
            <img src="${e.target.result}" alt="전송된 이미지">
          </div>
        `;
        chatArea.appendChild(row);
        chatArea.scrollTop = chatArea.scrollHeight;
      }
      reader.readAsDataURL(input.files[0]);
    }
  }

  // 봇 자동 답장 시뮬레이션
  function simulateAutoReply() {
    const chatArea = document.getElementById('chatArea');
    const row = document.createElement('div');
    row.className = 'message-row other';
    row.innerHTML = `
      <img src="https://via.placeholder.com/40" class="profile-img" alt="프로필">
      <div>
        <div style="font-size: 11px; margin-bottom: 2px;">어피치</div>
        <div class="bubble" oncontextmenu="showMenu(event, this)">자동 응답 메시지입니다! 🍑</div>
      </div>
      <div class="time-read">
        <span>${getCurrentTime()}</span>
      </div>
    `;
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // 엔터키 전송 처리
  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  }

  // 다크모드 토글
  function toggleTheme() {
    const app = document.getElementById('app');
    const currentTheme = app.getAttribute('data-theme');
    if (currentTheme === 'dark') {
      app.removeAttribute('data-theme');
    } else {
      app.setAttribute('data-theme', 'dark');
    }
  }

  // 우클릭 메뉴 (삭제/답장 기능 시뮬레이션)
  function showMenu(e, element) {
    e.preventDefault();
    selectedBubble = element;
    const menu = document.getElementById('contextMenu');
    menu.style.display = 'block';
    menu.style.left = e.offsetX + 'px';
    menu.style.top = e.offsetY + 'px';
  }

  function deleteMessage() {
    if (selectedBubble) {
      selectedBubble.textContent = "삭제된 메시지입니다.";
      selectedBubble.style.color = "#888";
      selectedBubble.style.fontStyle = "italic";
    }
    hideMenu();
  }

  function replyMessage() {
    if (selectedBubble) {
      const input = document.getElementById('messageInput');
      input.value = `"> ${selectedBubble.textContent}" 에 대한 답장: `;
      input.focus();
    }
    hideMenu();
  }

  function hideMenu() {
    document.getElementById('contextMenu').style.display = 'none';
  }

  document.addEventListener('click', hideMenu);

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>

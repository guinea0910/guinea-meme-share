<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짤·영상 카페 (다크 모드)</title>
    <style>
        :root {
            --cafe-green: #03c75a;
            --cafe-green-hover: #02b350;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        h2 { color: var(--cafe-green); }
        .form-box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--cafe-green);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: var(--cafe-green-hover); }
        .post-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        .post-author { font-weight: bold; color: var(--cafe-green); margin-bottom: 5px; }
        .post-content { color: var(--text-main); white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>🍀 짤·영상 카페</h2>
    
    <div class="form-box">
        <input type="text" id="nickname" placeholder="닉네임">
        <textarea id="content" rows="3" placeholder="게시글 내용을 입력해 주세요..."></textarea>
        <button id="submitBtn">등록</button>
    </div>

    <h3>전체 목록</h3>
    <div id="postsContainer">게시글을 불러오는 중...</div>

    <!-- Firebase 및 Firestore 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfcOH-oargpwPPSxJwIycKnx7o9OGWxwo",
            authDomain: "guinea-meme-share.firebaseapp.com",
            projectId: "guinea-meme-share",
            storageBucket: "guinea-meme-share.firebasestorage.app",
            messagingSenderId: "282265476408",
            appId: "1:282265476408:web:f07087dd3a2cf80093b5cd",
            measurementId: "G-9W4YK0GMK4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const submitBtn = document.getElementById('submitBtn');
        const nicknameInput = document.getElementById('nickname');
        const contentInput = document.getElementById('content');
        const postsContainer = document.getElementById('postsContainer');

        // 게시글 불러오기
        async function loadPosts() {
            postsContainer.innerHTML = '불러오는 중...';
            try {
                const q = query(collection(db, "posts"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    postsContainer.innerHTML = '등록된 게시물이 없습니다. 첫 글을 작성해 보세요!';
                    return;
                }

                postsContainer.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const post = doc.data();
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `
                        <div class="post-author">${escapeHtml(post.nickname || '익명')}</div>
                        <div class="post-content">${escapeHtml(post.content || '')}</div>
                    `;
                    postsContainer.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                postsContainer.innerHTML = '게시글을 불러오는 데 실패했습니다.';
            }
        }

        // 게시글 작성하기
        submitBtn.addEventListener('click', async () => {
            const nickname = nicknameInput.value.trim();
            const content = contentInput.value.trim();

            if (!nickname || !content) {
                alert('닉네임과 내용을 모두 입력해 주세요!');
                return;
            }

            try {
                await addDoc(collection(db, "posts"), {
                    nickname: nickname,
                    content: content,
                    createdAt: Date.now()
                });

                nicknameInput.value = '';
                contentInput.value = '';
                loadPosts(); // 작성 후 목록 새로고침
            } catch (error) {
                console.error(error);
                alert('게시글 등록에 실패했습니다.');
            }
        });

        // HTML 특수문자 이스케이프 (보안용)
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 페이지 접속 시 목록 불러오기
        loadPosts();
    </script>
</body>
</html>

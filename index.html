<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짤·영상 카페 (다크 모드)</title>
    <style>
        :root {
            --cafe-green: #03c75a;
            --cafe-green-hover: #02b350;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        h2 { color: var(--cafe-green); }
        .form-box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
        }
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 10px;
            cursor: pointer;
            background-color: rgba(15, 23, 42, 0.5);
        }
        .drop-zone.dragover {
            border-color: var(--cafe-green);
            color: var(--cafe-green);
        }
        input[type="file"] { display: none; }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--cafe-green);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: var(--cafe-green-hover); }
        .post-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        .post-author { font-weight: bold; color: var(--cafe-green); margin-bottom: 5px; }
        .post-content { color: var(--text-main); white-space: pre-wrap; margin-bottom: 10px; }
        .post-img { max-width: 100%; border-radius: 6px; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>🍀 짤·영상 카페</h2>
    
    <div class="form-box">
        <input type="text" id="nickname" placeholder="닉네임">
        <textarea id="content" rows="3" placeholder="게시글 내용을 입력해 주세요..."></textarea>
        
        <div id="dropZone" class="drop-zone">
            이미지를 여기에 드래그하거나 클릭해서 업로드하세요
            <input type="file" id="imageFile" accept="image/*">
        </div>
        <div id="fileName" style="font-size: 12px; color: var(--text-sub); margin-bottom: 10px;"></div>

        <button id="submitBtn">등록</button>
    </div>

    <h3>전체 목록</h3>
    <div id="postsContainer">게시글을 불러오는 중...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfcOH-oargpwPPSxJwIycKnx7o9OGWxwo",
            authDomain: "guinea-meme-share.firebaseapp.com",
            projectId: "guinea-meme-share",
            storageBucket: "guinea-meme-share.firebasestorage.app",
            messagingSenderId: "282265476408",
            appId: "1:282265476408:web:f07087dd3a2cf80093b5cd",
            measurementId: "G-9W4YK0GMK4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const submitBtn = document.getElementById('submitBtn');
        const nicknameInput = document.getElementById('nickname');
        const contentInput = document.getElementById('content');
        const postsContainer = document.getElementById('postsContainer');
        const dropZone = document.getElementById('dropZone');
        const imageFileInput = document.getElementById('imageFile');
        const fileNameDisplay = document.getElementById('fileName');

        let base64Image = '';

        // 드래그 앤 드롭 및 파일 선택 처리 (Base64 변환)
        dropZone.addEventListener('click', () => imageFileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        imageFileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                processFile(e.target.files[0]);
            }
        });

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                base64Image = e.target.result; // 이미지를 텍스트(Base64)로 변환
                fileNameDisplay.textContent = `선택된 파일: ${file.name}`;
            };
            reader.readAsDataURL(file);
        }

        // 게시글 불러오기
        async function loadPosts() {
            postsContainer.innerHTML = '불러오는 중...';
            try {
                const q = query(collection(db, "posts"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    postsContainer.innerHTML = '등록된 게시물이 없습니다. 첫 글을 작성해 보세요!';
                    return;
                }

                postsContainer.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const post = doc.data();
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    
                    let imageHtml = '';
                    if (post.imageUrl) {
                        imageHtml = `<img src="${post.imageUrl}" class="post-img" alt="업로드 이미지">`;
                    }

                    card.innerHTML = `
                        <div class="post-author">${escapeHtml(post.nickname || '익명')}</div>
                        <div class="post-content">${escapeHtml(post.content || '')}</div>
                        ${imageHtml}
                    `;
                    postsContainer.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                postsContainer.innerHTML = '게시글을 불러오는 데 실패했습니다.';
            }
        }

        // 게시글 작성하기 (Firestore에 텍스트+이미지 데이터 한 번에 저장)
        submitBtn.addEventListener('click', async () => {
            const nickname = nicknameInput.value.trim();
            const content = contentInput.value.trim();

            if (!nickname || !content) {
                alert('닉네임과 내용을 모두 입력해 주세요!');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '등록 중...';

            try {
                await addDoc(collection(db, "posts"), {
                    nickname: nickname,
                    content: content,
                    imageUrl: base64Image, // 변환된 이미지 문자열 저장
                    createdAt: Date.now()
                });

                // 초기화
                nicknameInput.value = '';
                contentInput.value = '';
                base64Image = '';
                fileNameDisplay.textContent = '';
                imageFileInput.value = '';

                loadPosts();
            } catch (error) {
                console.error(error);
                alert('게시글 등록에 실패했습니다.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '등록';
            }
        });

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        loadPosts();
    </script>
</body>
</html>
